<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix — Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <header class="login-header">
        <a href="index.html">
            <img src="https://occ.a.nflxso.net/dnmt/api/v6/iL4oJVDYZ8KLSrJ6eG2OwtghbfQ/AAAAAVIENVPMEM3Kn4hVzJseX4N8xPjtBDIpwuFDucWksdxQZ8Ss6Xf8U_vt7ThYYfRmzq0x1CS3nOwTGyVrgADvwfB_tPiK_liS2RjvI40RJSzbKRk-o8b3nCxHfCCnBsyB2XBB9_vRoSmN.svg" alt="logo" class="netflix-logo">
        </a>
    </header>

    <main class="login-container">
        <div class="login-box">
            <h2>Введите свои данные<br>для входа</h2>
            <p class="subtitle">Или зарегистрируйте новый аккаунт.</p>
            
            <form action="#" method="POST">
                <div class="input-field">
                    <input type="text" placeholder="Адрес эл. почты или номер телефона" required>
                </div>
                
                <button type="submit" class="submit-btn">Продолжить</button>
            </form>

            <div class="help-link">
                <a href="#">Получить помощь <span>&#x25BE;</span></a>
            </div>

            <p class="recaptcha-text">
                Эта страница защищена Google reCAPTCHA, чтобы мы знали, что вы не бот.
            </p>
        </div>
    </main>
</body>
</html>
